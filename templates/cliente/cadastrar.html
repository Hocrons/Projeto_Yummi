{% extends "base.html" %}
{% block title %}Cadastro - Cliente{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Criar conta de cliente</h2>

    <form method="post">
        <label>Nome completo
            <input type="text" name="nome" required>
        </label>
        <label>Apelido (como quer ser chamado)
            <input type="text" name="apelido">
        </label>
        <label>CPF (somente números)
            <input type="text" name="cpf" maxlength="11" pattern="\d{11}" required>
        </label>
        <label>E-mail
            <input type="email" name="email" required>
        </label>
        <label>Telefone
            <input type="text" name="telefone">
        </label>
        <label>Senha
            <input type="password" name="senha" minlength="6" required>
        </label>
        <button type="submit" class="btn btn--primary btn--full">Cadastrar</button>
    </form>

    <div class="divisor-social"><span>ou cadastre-se com</span></div>

    <div class="botoes-social">
        <a href="{{ url_for('auth.login_google') }}" class="btn-social btn-social--google">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 7 29.6 5 24 5c-7.6 0-14.1 4.3-17.4 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.2l-6.6-5.6C29.6 34.8 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C40.5 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
            Cadastrar com Google
        </a>
        <a href="{{ url_for('auth.login_facebook') }}" class="btn-social btn-social--facebook">
            <svg viewBox="0 0 24 24" fill="white"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.9h-2.34V22c4.78-.79 8.44-4.93 8.44-9.94z"/></svg>
            Cadastrar com Facebook
        </a>
    </div>

    <p class="muted">Já tem conta? <a href="{{ url_for('auth.login_cliente') }}">Entrar</a></p>
</div>
{% endblock %}
