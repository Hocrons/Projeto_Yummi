{% extends "base.html" %}
{% block title %}Entrar com celular{% endblock %}
{% block content %}
<div class="form-card">
    <a href="{{ url_for('auth.entrar') }}" class="link-voltar">&lsaquo;</a>
    <h2 class="entrada-titulo-sm">
        Informe o número do seu <span class="destaque-google">celular</span> para continuar
    </h2>

    <form method="post" id="form-telefone" novalidate>
        <label class="campo-telefone-label">Número com DDD</label>
        <div class="campo-telefone">
            <span class="prefixo-pais">
                <span class="prefixo-pais__flag">🇧🇷</span>
                <span class="prefixo-pais__codigo">+55</span>
            </span>
            <span class="campo-telefone__divisor"></span>
            <input type="tel"
                   name="telefone"
                   id="campo-telefone-input"
                   placeholder="(11) 99999-9999"
                   inputmode="numeric"
                   autocomplete="tel-national"
                   maxlength="15"
                   required
                   autofocus>
        </div>
        <p class="campo-telefone__ajuda" id="campo-telefone-ajuda">
            Digite DDD + número. Ex: <strong>(11) 99999-9999</strong>
        </p>

        <p class="muted" style="margin: 24px 0 10px;">Como deseja receber seu código?</p>
        <button type="submit" class="btn btn--primary btn--full">WhatsApp</button>
    </form>
</div>
{% endblock %}

{% block js %}
<script>
(function () {
    "use strict";

    const input = document.getElementById("campo-telefone-input");
    const ajuda = document.getElementById("campo-telefone-ajuda");
    const form = document.getElementById("form-telefone");

    if (!input) return;

    function aplicarMascara(valor) {
        const d = valor.replace(/\D/g, "").slice(0, 11);
        if (d.length === 0) return "";
        if (d.length <= 2) return "(" + d;
        if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2);
        if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6);
        return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
    }

    input.addEventListener("input", (e) => {
        const cursorNoFim = e.target.selectionStart === e.target.value.length;
        e.target.value = aplicarMascara(e.target.value);
        if (cursorNoFim) {
            e.target.setSelectionRange(e.target.value.length, e.target.value.length);
        }
        input.classList.remove("campo-telefone__input--erro");
        ajuda.classList.remove("campo-telefone__ajuda--erro");
    });

    form.addEventListener("submit", (e) => {
        const digitos = input.value.replace(/\D/g, "");
        if (digitos.length !== 10 && digitos.length !== 11) {
            e.preventDefault();
            input.classList.add("campo-telefone__input--erro");
            ajuda.classList.add("campo-telefone__ajuda--erro");
            ajuda.innerHTML = "Número inválido. Use <strong>DDD + número</strong>, ex: (11) 99999-9999";
            input.focus();
        }
    });
})();
</script>
{% endblock %}
