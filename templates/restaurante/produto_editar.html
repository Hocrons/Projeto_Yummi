{% extends "base.html" %}
{% block title %}Editar produto{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Editar produto</h2>
    <form method="post">
        <label>Nome
            <input type="text" name="nome" value="{{ produto.nome }}" required>
        </label>
        <label>Descrição
            <textarea name="descricao" rows="3">{{ produto.descricao or '' }}</textarea>
        </label>
        <label>Preço (R$)
            <input type="number" step="0.01" min="0" name="preco" value="{{ produto.preco }}" required>
        </label>
        <label class="checkbox-linha">
            <input type="checkbox" name="disponivel" {{ 'checked' if produto.disponivel }}> Disponível no cardápio
        </label>
        <button type="submit" class="btn btn--primary btn--full">Salvar alterações</button>
    </form>
</div>
{% endblock %}
