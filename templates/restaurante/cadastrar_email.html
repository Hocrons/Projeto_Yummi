{% extends "base.html" %}
{% block title %}Cadastro - Restaurante{% endblock %}
{% block content %}
<div class="form-card">
    <a href="{{ url_for('auth.login_restaurante') }}" class="link-voltar">&lsaquo;</a>
    <p class="entrada-titulo-sm" style="text-align:center;">
        Informe seu <span class="destaque-google">e-mail</span> para começar o cadastro
    </p>

    <form method="post">
        <label>E-mail
            <input type="email" name="email" placeholder="seu@email.com" required autofocus>
        </label>
        <button type="submit" class="btn btn--primary btn--full" style="margin-top: 16px;">
            Continuar cadastro
        </button>
    </form>

    <p class="muted" style="text-align:center; margin-top: 16px;">
        Já tem conta? <a href="{{ url_for('auth.login_restaurante') }}">Entrar</a>
    </p>
</div>
{% endblock %}
