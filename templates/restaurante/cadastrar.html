{% extends "base.html" %}
{% block title %}Cadastro - Restaurante{% endblock %}
{% block content %}
<div class="form-card form-card--wide">
    <h2>Cadastrar restaurante</h2>
    <form method="post">
        <div class="form-grid">
            <label>Nome do responsável
                <input type="text" name="nome_responsavel" required>
            </label>
            <label>Nome fantasia
                <input type="text" name="nome_fantasia" required>
            </label>
            <label>CNPJ
                <input type="text" name="cnpj" required>
            </label>
            <label>Categoria
                <input type="text" name="categoria" placeholder="Ex: Pizza, Japonesa, Lanches">
            </label>
            <label>Taxa de entrega (R$)
                <input type="number" step="0.01" name="taxa_entrega" value="0">
            </label>
            <label>Horário de funcionamento
                <input type="text" name="horario_funcionamento" placeholder="Ex: 18h-23h">
            </label>
            <label>E-mail
                <input type="email" name="email" required>
            </label>
            <label>Telefone
                <input type="text" name="telefone">
            </label>
            <label>Senha
                <input type="password" name="senha" minlength="6" required>
            </label>
        </div>

        <h3>Endereço</h3>
        <div class="form-grid">
            <label>Rua <input type="text" name="rua"></label>
            <label>Número <input type="text" name="numero"></label>
            <label>Bairro <input type="text" name="bairro"></label>
            <label>Cidade <input type="text" name="cidade"></label>
            <label>CEP <input type="text" name="cep"></label>
        </div>

        <button type="submit" class="btn btn--primary btn--full">Cadastrar restaurante</button>
    </form>
    <p class="muted">Já tem conta? <a href="{{ url_for('auth.login_restaurante') }}">Entrar</a></p>
</div>
{% endblock %}
